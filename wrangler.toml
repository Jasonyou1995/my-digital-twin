# Cloudflare Workers config (static assets + one API route).
# `name` must match the Worker name in the Cloudflare dashboard.
# Secrets are NOT stored here. Set the key once with:
#   npx wrangler secret put OPENROUTER_API_KEY
# or Dashboard > Workers & Pages > my-digital-twin > Settings > Variables and Secrets (type: Secret).
# For local dev, copy .dev.vars.example to .dev.vars (gitignored).

name = "my-digital-twin"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Only /api/* hits the Worker; every other path is served straight from ./public.
run_worker_first = ["/api/*"]
not_found_handling = "none"

[vars]
# Any OpenRouter model id. Haiku is fast and cheap for a profile Q&A bot.
OPENROUTER_MODEL = "anthropic/claude-haiku-5.5"
# Public site URL, sent to OpenRouter as HTTP-Referer for attribution (optional).
SITE_URL = ""

[observability]
enabled = true

# Abuse protection at the Worker edge (20 requests/minute/IP per Cloudflare location).
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
